name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v0.1.1；留空使用 package.json）'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Get version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"

          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$TAG_VERSION"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$PACKAGE_VERSION"
          fi

          if [[ "$VERSION" != v* ]]; then
            VERSION="v$VERSION"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Use v1.2.3 or 1.2.3."
            exit 1
          fi

          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Release version '$VERSION' must match package.json version '$PACKAGE_VERSION'. Update package.json first."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify manual release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_VERSION does not exist. Push the version tag first, then run this workflow."
            exit 1
          fi

          REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$RELEASE_VERSION^{}" | awk 'NR == 1 { print $1 }')
          if [[ -z "$REMOTE_TAG_SHA" ]]; then
            REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$RELEASE_VERSION" | awk 'NR == 1 { print $1 }')
          fi
          CHECKOUT_SHA=$(git rev-parse HEAD)

          if [[ "$REMOTE_TAG_SHA" != "$CHECKOUT_SHA" ]]; then
            echo "::error::Tag $RELEASE_VERSION points to $REMOTE_TAG_SHA, but this workflow checked out $CHECKOUT_SHA. Dispatch the workflow from the tagged commit."
            exit 1
          fi

          echo "Using existing tag $RELEASE_VERSION at $CHECKOUT_SHA; no tag will be created or pushed."

      - name: Check for an existing release
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "::notice::Release $RELEASE_VERSION already exists; existing notes and assets are preserved; missing installers may be uploaded."
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create Draft Release
        if: steps.existing_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: AI Gist ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-android:
    needs: create-release
    if: needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
      - run: npm install -g typescript

      - name: Verify native version numbers
        run: yarn version:check

      - name: Build mobile web assets
        run: yarn build:mobile

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Fix Gradle distribution URL
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Check signing configuration
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Keystore
        if: steps.signing.outputs.available == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Signed Release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEY_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build Debug APK (No Signing Config)
        if: steps.signing.outputs.available != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect and rename APK
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" "AI-Gist-${VERSION}-android.apk"

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          APK_PATH="AI-Gist-${VERSION}-android.apk"
          EXISTING_ASSETS=$(gh release view "$VERSION" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          if grep -Fqx "$APK_PATH" <<< "$EXISTING_ASSETS"; then
            echo "Skipping existing Release asset $APK_PATH"
          else
            gh release upload "$VERSION" "$APK_PATH" \
              --repo ${{ github.repository }}
          fi

  prune-release-assets:
    needs: [create-release, build-android]
    if: always() && needs.create-release.result == 'success' && needs.create-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Remove electron-updater metadata from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          ASSETS=$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')

          PRUNED=0
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            case "$asset" in
              latest*.yml|*.blockmap)
                echo "Removing $asset"
                gh release delete-asset "$RELEASE_VERSION" "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
                PRUNED=$((PRUNED + 1))
                ;;
            esac
          done <<< "$ASSETS"

          if [[ "$PRUNED" -eq 0 ]]; then
            echo '- Release 资产已是干净状态，无需清理' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 已从 Release 移除 $PRUNED 个 electron-updater 元数据文件（latest*.yml / *.blockmap）" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo '### Release 资产' >> "$GITHUB_STEP_SUMMARY"
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "- \(.name)（\(.size) 字节）"' >> "$GITHUB_STEP_SUMMARY"
